name: D3 Studio validation

on:
  push:
    branches:
      - d3-v1-working-release
    paths:
      - 'd3-3d-studio/**'
      - '.github/workflows/d3-studio-validation.yml'
  pull_request:
    paths:
      - 'd3-3d-studio/**'
      - '.github/workflows/d3-studio-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML structure and extract module
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import sys

          path = Path("d3-3d-studio/index.html")
          html = path.read_text(encoding="utf-8")

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.script_types = []
                  self.module_depth = 0
                  self.module_parts = []
                  self.in_module = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "script":
                      self.script_types.append(attrs.get("type", ""))
                      if attrs.get("type") == "module":
                          self.in_module = True
                          self.module_depth += 1
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_module:
                      self.module_depth -= 1
                      if self.module_depth == 0:
                          self.in_module = False
              def handle_data(self, data):
                  if self.in_module:
                      self.module_parts.append(data)

          audit = Audit()
          audit.feed(html)
          duplicates = sorted({x for x in audit.ids if audit.ids.count(x) > 1})
          if duplicates:
              print("Duplicate HTML IDs:", ", ".join(duplicates))
              sys.exit(1)
          if audit.script_types.count("module") != 1:
              print("Expected exactly one module script; found", audit.script_types.count("module"))
              sys.exit(1)
          if len(audit.script_types) != 1:
              print("Unexpected additional script tags:", audit.script_types)
              sys.exit(1)
          module = "".join(audit.module_parts).strip()
          if not module:
              print("Module script is empty")
              sys.exit(1)
          Path("/tmp/d3-studio-module.mjs").write_text(module, encoding="utf-8")
          print(f"HTML audit passed: {len(audit.ids)} IDs, no duplicates, one module script.")
          PY

      - name: Check JavaScript module syntax
        run: node --check /tmp/d3-studio-module.mjs

      - name: Install browser test dependency
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run D3 Studio browser smoke test
        run: node d3-3d-studio/smoke-test.mjs
